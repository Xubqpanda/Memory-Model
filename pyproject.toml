[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-transformer"
version = "0.1.0"
description = "A decoder-only Transformer implemented from scratch for study"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "tiktoken>=0.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["datasets>=2.14"]
dev = ["pytest>=7"]
tracking = ["wandb>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
