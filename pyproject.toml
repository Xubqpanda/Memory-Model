[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-model"
version = "0.1.0"
description = "A research codebase for vanilla and memory-augmented language models"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "tiktoken>=0.5",
    "tokenizers>=0.15",
    "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["datasets>=2.14"]
dev = ["pytest>=7"]
tracking = ["wandb>=0.17"]
web = ["gradio>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
